[project]
name = "mds5120-agent-backend"
version = "0.2.0"
description = "MDS5120 AI Agent task and usage billing platform MVP"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28.1",
    "argon2-cffi>=25.1.0",
    "python-multipart>=0.0.32",
    "pypdf>=6.21.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
